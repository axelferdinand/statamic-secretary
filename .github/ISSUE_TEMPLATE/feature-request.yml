name: Feature request
description: Suggest a focused improvement to the editor or developer experience.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should Secretary solve?
      description: Describe the user, context, and current workaround before proposing an interface.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Editor
        - Developer
        - Site administrator
        - Relay operator
        - Multiple audiences
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Content boundary
      options:
        - label: This request can preserve Secretary's content-only boundary.
          required: true

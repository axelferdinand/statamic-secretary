name: Bug report
description: Report a reproducible problem with Secretary.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Secretary. Never include API keys, Postmark tokens, pairing codes, raw customer content, or personal data. Report security issues privately instead.
  - type: input
    id: secretary-version
    attributes:
      label: Secretary version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Statamic, Laravel, and PHP versions
      placeholder: Statamic 6.26, Laravel 12.64, PHP 8.4
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Where did it happen?
      options:
        - Control Panel chat
        - Secretary Relay email
        - Private Postmark email
        - Onboarding or settings
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use demo or redacted content only.
      placeholder: |
        1. Open …
        2. Ask …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant System status output or sanitized logs. Remove secrets and customer content first.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and private customer content.
          required: true
        - label: This is not a security vulnerability.
          required: true

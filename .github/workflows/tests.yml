name: tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
          - php: '8.4'
            testbench: '^11.0'
          - php: '8.5'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --with-all-dependencies --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer audit --locked

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: git diff --exit-code -- resources/dist

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build Composer and Packagist-style archives
        run: |
          COMPOSER_ROOT_VERSION=0.1.0 composer archive --format=zip --dir=/tmp --file=statamic-secretary
          git archive --format=zip --output=/tmp/statamic-secretary-git.zip HEAD
      - name: Inspect release archives
        run: |
          for archive in /tmp/statamic-secretary.zip /tmp/statamic-secretary-git.zip; do
            unzip -Z1 "$archive" > /tmp/archive-files.txt
            ! grep -E '(^|/)(\.secretary-deploy|node_modules|vendor|sandbox|tests|relay)(/|$)|(^|/)\.env$|\.phpunit' /tmp/archive-files.txt
            grep -E '(^|/)resources/dist/build/manifest.json$' /tmp/archive-files.txt
            grep -E '(^|/)database/migrations/2026_07_21_000006_create_secretary_settings_table.php$' /tmp/archive-files.txt
            grep -E '(^|/)src/Http/Controllers/Web/RelayInboundController.php$' /tmp/archive-files.txt
            grep -E '(^|/)src/Relay/RelayClient.php$' /tmp/archive-files.txt
          done
      - name: Install the Packagist-style archive in a clean Statamic site
        run: |
          mkdir -p /tmp/secretary-package /tmp/secretary-artifacts
          unzip -q /tmp/statamic-secretary-git.zip -d /tmp/secretary-package
          php -r '$path = "/tmp/secretary-package/composer.json"; $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR); $data["version"] = "0.1.0"; file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);'
          (cd /tmp/secretary-package && zip -qr /tmp/secretary-artifacts/axelferdinand-statamic-secretary-0.1.0.zip .)
          composer create-project statamic/statamic /tmp/secretary-smoke '^6.0' --no-interaction --prefer-dist
          composer --working-dir=/tmp/secretary-smoke config repositories.secretary artifact /tmp/secretary-artifacts
          composer --working-dir=/tmp/secretary-smoke require axelferdinand/statamic-secretary:^0.1 --no-interaction --prefer-dist
          php /tmp/secretary-smoke/artisan migrate --force --no-interaction
          php /tmp/secretary-smoke/please stache:refresh --no-interaction
          composer --working-dir=/tmp/secretary-smoke show axelferdinand/statamic-secretary
          php /tmp/secretary-smoke/artisan list --raw | grep -q '^secretary:doctor'
          php /tmp/secretary-smoke/artisan route:list --path=secretary | grep -q 'cp/secretary'
          test -f /tmp/secretary-smoke/public/vendor/statamic-secretary/build/manifest.json

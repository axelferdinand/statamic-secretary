<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
    <title id="title">Secretary for Statamic icon concept</title>
    <desc id="desc">An email instruction becoming a structured, approved Statamic draft.</desc>

    <defs>
        <linearGradient id="background" x1="80" y1="80" x2="920" y2="940" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#041f29"/>
            <stop offset="1" stop-color="#082f3d"/>
        </linearGradient>
        <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientTransform="translate(870 118) rotate(131) scale(550)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#08efad" stop-opacity=".22"/>
            <stop offset="1" stop-color="#08efad" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="paper" x1="500" y1="150" x2="830" y2="780" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fffdf9"/>
            <stop offset="1" stop-color="#f4f0e7"/>
        </linearGradient>
        <linearGradient id="coral" x1="160" y1="290" x2="500" y2="620" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff7966"/>
            <stop offset="1" stop-color="#ff654f"/>
        </linearGradient>
        <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
            <path d="M56 0H0V56" fill="none" stroke="#fffdf9" stroke-opacity=".055" stroke-width="2"/>
        </pattern>
        <filter id="shadow" x="-30%" y="-30%" width="180%" height="190%">
            <feDropShadow dx="0" dy="34" stdDeviation="28" flood-color="#020e13" flood-opacity=".35"/>
        </filter>
        <filter id="smallShadow" x="-50%" y="-50%" width="220%" height="230%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#041f29" flood-opacity=".28"/>
        </filter>
    </defs>

    <rect width="1024" height="1024" rx="184" fill="url(#background)"/>
    <rect width="1024" height="1024" rx="184" fill="url(#mintGlow)"/>
    <rect width="1024" height="1024" rx="184" fill="url(#grid)"/>

    <circle cx="906" cy="96" r="260" fill="none" stroke="#08efad" stroke-opacity=".14" stroke-width="3"/>
    <circle cx="906" cy="96" r="184" fill="none" stroke="#08efad" stroke-opacity=".1" stroke-width="3"/>
    <circle cx="110" cy="912" r="225" fill="none" stroke="#ff654f" stroke-opacity=".1" stroke-width="3"/>

    <g filter="url(#shadow)">
        <g transform="rotate(-7 330 500)">
            <rect x="104" y="292" width="444" height="334" rx="58" fill="#08efad" fill-opacity=".17" transform="translate(20 26)"/>
            <rect x="104" y="292" width="444" height="334" rx="58" fill="#fffdf9" stroke="#041f29" stroke-width="26"/>

            <path d="M126 326L326 486L526 326" fill="url(#coral)" stroke="#041f29" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/>
            <path d="M126 589L326 432L526 589" fill="#f4f0e7" stroke="#041f29" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/>
            <path d="M126 326V580C126 593 136 604 149 604H503C516 604 526 593 526 580V326" fill="none" stroke="#041f29" stroke-linejoin="round" stroke-width="26"/>
        </g>

        <g transform="rotate(5 698 498)">
            <rect x="492" y="152" width="380" height="638" rx="62" fill="#08efad" fill-opacity=".19" transform="translate(22 27)"/>
            <path d="M554 152H755L872 270V728C872 762 844 790 810 790H554C520 790 492 762 492 728V214C492 180 520 152 554 152Z" fill="url(#paper)" stroke="#041f29" stroke-linejoin="round" stroke-width="28"/>
            <path d="M755 154V235C755 254 770 270 790 270H869" fill="#e7e0d3" stroke="#041f29" stroke-linejoin="round" stroke-width="28"/>

            <rect x="544" y="232" width="136" height="43" rx="21.5" fill="#c8f8e8"/>
            <circle cx="571" cy="254" r="8" fill="#08efad"/>
            <path d="M594 254H653" stroke="#087054" stroke-linecap="round" stroke-width="12"/>

            <rect x="544" y="326" width="272" height="76" rx="20" fill="#082f3d"/>
            <rect x="565" y="347" width="34" height="34" rx="10" fill="#08efad"/>
            <path d="M623 350H781M623 376H740" stroke="#fffdf9" stroke-linecap="round" stroke-width="14"/>

            <rect x="544" y="428" width="272" height="76" rx="20" fill="#f4f0e7" stroke="#082f3d" stroke-width="12"/>
            <rect x="565" y="449" width="34" height="34" rx="10" fill="#f8d95c"/>
            <path d="M623 452H781M623 478H716" stroke="#082f3d" stroke-linecap="round" stroke-width="14"/>

            <rect x="544" y="530" width="272" height="76" rx="20" fill="#f4f0e7" stroke="#082f3d" stroke-width="12"/>
            <rect x="565" y="551" width="34" height="34" rx="10" fill="#ff654f"/>
            <path d="M623 554H781M623 580H750" stroke="#082f3d" stroke-linecap="round" stroke-width="14"/>

            <g filter="url(#smallShadow)">
                <rect x="574" y="655" width="212" height="82" rx="26" fill="#08efad" stroke="#041f29" stroke-width="12"/>
                <path d="M625 694L658 719L720 670" fill="none" stroke="#041f29" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/>
            </g>
        </g>
    </g>

    <g filter="url(#smallShadow)" transform="translate(846 66) scale(.92)">
        <path d="M0 40C34 35 44 22 50-12C56 22 66 35 100 40C66 45 56 58 50 92C44 58 34 45 0 40Z" fill="#08efad" stroke="#041f29" stroke-linejoin="round" stroke-width="12"/>
    </g>
</svg>
